[project]
name = "llm-from-zero-to-one"
version = "0.1.0"
description = "A from-scratch PyTorch LLM training framework for education and experimentation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "byhieg", email = "byhieg@gmail.com" },
]
keywords = [
    "large-language-models",
    "llm",
    "pytorch",
    "transformer",
    "training",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "datasets>=4.6.1",
    "jaxtyping>=0.3.7",
    "modelscope>=1.35.0",
    "numpy>=2.2.6",
    "oss2>=2.19.1",
    "tqdm>=4.67.3",
    "transformers>=5.4.0",
]

[project.urls]
Homepage = "https://github.com/byhieg/llm_from_zero_to_one"
Repository = "https://github.com/byhieg/llm_from_zero_to_one"
Issues = "https://github.com/byhieg/llm_from_zero_to_one/issues"

[project.optional-dependencies]
# PyTorch/DeepSpeed 通常需要与 CUDA、驱动和机器镜像强绑定，默认不由 uv 安装，
# 避免同步项目依赖时覆盖外部 Python 环境中已经配置好的训练栈。
torch = [
    "torch>=2.10.0",
]
deepspeed = [
    "deepspeed>=0.19.2",
]
swanlab = [
    "swanlab>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "dataset*",
    "logger*",
    "models*",
    "trainer*",
]

[tool.ruff.lint]
# 忽略 jaxtyping 语法导致的 F722 错误
ignore = ["F722"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.9",
]

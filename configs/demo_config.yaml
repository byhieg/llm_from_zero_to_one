experiment:
  mode: pretrain
  name: minimind_dataset_gpt2_61M
  swanlab:
    enabled: true
    project: llm-pretrain
    tags: []

model:
  name: gpt2
  config:
    vocab_size: 6400
    n_layer: 8
    n_head: 8
    n_embd: 768


train:
  batch_size: 32
  seq_len: 340
  epoch_num: 2
  log_steps: 100
  seed: 42
  backend: deepspeed
  deepspeed_config: xxx/deepspeed_config.json

checkpoint:
  save_steps: 1000
  checkpoint_dir: checkpoints/pretrain
  resume_from_checkpoint: null

data:
  train:
    data_strategy: 'padding'
    dataset_config:
      dataset_path: json
      dataset_name: ""
      data_files:
        train: /root/autodl-tmp/pretrain_t2t_mini.jsonl
      tokenizer_path: 'jingyaogong/minimind-3'
      split: 'train'
      col_name: 'text'
      add_bos_id: true
      add_eos_id: true
    dataloader_config:
      shuffle: true
      num_workers: 8
      pin_memory: true
      drop_last: false
      persistent_workers: false
      seed: 42
